name: Empirical rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild from pinned Zenodo source
        run: python scripts/fetch_and_analyze.py --write

      - name: Confirm regenerated evidence matches the release
        run: git diff --exit-code -- data/derived/primary_results.csv results/empirical_summary.json
