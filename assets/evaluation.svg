<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Evidence boundary and L&amp;D interpretation</text><rect x="55" y="100" width="1090" height="96" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="73" y="131" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">Observed network</text><text x="73" y="157" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">148 nodes • 10,885 timestamped hyperedges • 2,583 projection edges • baseline efficiency 0.5601</text><rect x="55" y="220" width="1090" height="96" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="73" y="251" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">Stress-test finding</text><text x="73" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Targeted retained efficiency falls 0.9735 → 0.8608 while the random mean remains close to baseline.</text><rect x="55" y="340" width="1090" height="96" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/><text x="73" y="371" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#92400e">Comparator evidence</text><text x="73" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Targeted is below random p05 at every k; targeted-versus-random mean gap widens 0.0238 → 0.1304.</text><rect x="55" y="460" width="1090" height="96" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="73" y="491" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">Claim boundary</text><text x="73" y="517" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Email connectivity is not tacit knowledge, expertise quality, employee value, learning effectiveness, or causal business performance.</text><text x="55" y="630" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">L&amp;D use: identify where succession, cross-training, mentoring, documentation, or community-of-practice investigation may deserve attention.</text></svg>