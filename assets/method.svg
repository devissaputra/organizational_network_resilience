<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Reproducible resilience analysis pipeline</text><text x="55" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">Source hypergraph → simple projection → stress test → comparator → bounded L&amp;D interpretation</text><rect x="45" y="135" width="205" height="125" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="63" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">1 • Enron hypergraph</text><text x="63" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">148 nodes</text><text x="63" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">10,885 email events</text><text x="63" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">26,914 incidences</text><rect x="290" y="135" width="205" height="125" rx="15" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/><text x="308" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#0e7490">2 • Project network</text><text x="308" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Deduplicate event members</text><text x="308" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Undirected simple ties</text><text x="308" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2,583 edges</text><rect x="535" y="135" width="205" height="125" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="553" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">3 • Baseline access</text><text x="553" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Global efficiency</text><text x="553" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">0.5601</text><text x="553" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Survivor-pair metric</text><rect x="780" y="135" width="205" height="125" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="798" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#6d28d9">4 • Rank once</text><text x="798" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Intact-network degree</text><text x="798" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Static key-actor order</text><line x1="250" y1="198" x2="278" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="278,192 290,198 278,204" fill="#64748b"/><line x1="495" y1="198" x2="523" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="523,192 535,198 523,204" fill="#64748b"/><line x1="740" y1="198" x2="768" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="768,192 780,198 768,204" fill="#64748b"/><rect x="780" y="335" width="205" height="135" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="798" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">5 • Targeted loss</text><text x="798" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Remove top k</text><text x="798" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">5 / 10 / 15 / 20 / 30</text><text x="798" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Recompute efficiency</text><line x1="882" y1="260" x2="870" y2="335" stroke="#dc2626" stroke-width="2"/><polygon points="870,329 882,335 870,341" fill="#dc2626"/><rect x="505" y="335" width="225" height="135" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="523" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">6 • Comparator</text><text x="523" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">200 same-count draws</text><text x="523" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Seed 20260925</text><text x="523" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Mean + p05 / p95</text><line x1="780" y1="402" x2="718" y2="402" stroke="#2563eb" stroke-width="2"/><polygon points="718,396 730,402 718,408" fill="#2563eb"/><rect x="230" y="335" width="225" height="135" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/><text x="248" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#92400e">7 • Compare resilience</text><text x="248" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Retained efficiency</text><text x="248" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Gap growth</text><text x="248" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Lower-tail diagnostic</text><line x1="505" y1="402" x2="443" y2="402" stroke="#f59e0b" stroke-width="2"/><polygon points="443,396 455,402 443,408" fill="#f59e0b"/><rect x="230" y="540" width="755" height="105" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="248" y="571" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#334155">8 • L&amp;D interpretation</text><text x="248" y="597" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Diagnose structural continuity exposure before choosing succession, cross-training, mentoring, or documentation actions</text><text x="248" y="618" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Do not infer tacit knowledge, employee value, learning effectiveness, or causal business impact</text><line x1="342" y1="470" x2="330" y2="540" stroke="#0891b2" stroke-width="2"/><polygon points="330,534 342,540 330,546" fill="#0891b2"/><line x1="618" y1="470" x2="606" y2="540" stroke="#2563eb" stroke-width="2"/><polygon points="606,534 618,540 606,546" fill="#2563eb"/><line x1="882" y1="470" x2="870" y2="540" stroke="#dc2626" stroke-width="2"/><polygon points="870,534 882,540 870,546" fill="#dc2626"/><text x="55" y="700" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">Key safeguard: the targeted rule is static degree loss, the comparator band is descriptive, and the network is a communication proxy rather than a knowledge measure.</text></svg>