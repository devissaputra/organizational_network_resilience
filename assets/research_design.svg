<text x="925" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#7c2d12">Targeted retained</text><text x="925" y="428" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#dc2626">0.8608</text><text x="925" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#7c2d12">Random mean</text><text x="925" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#2563eb">0.9912</text><text x="925" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#7c2d12">Gap = 0.1304</text><text x="925" y="550" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#7c2d12">Targeted stays below random p05</text><text x="925" y="570" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#7c2d12">at all five released stress levels.</text><text x="55" y="704" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">The blue band is an empirical random-comparator band, not a confidence interval. Email connectivity is a structural proxy for potential information access.</text></svg>