<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">From communication structure to knowledge-continuity questions</text><text x="55" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">The analysis separates what is observed, what is calculated, and what L&amp;D may investigate next.</text><rect x="55" y="125" width="300" height="125" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="73" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">Observed evidence</text><text x="73" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Timestamped Enron email events</text><text x="73" y="203" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Core address set</text><text x="73" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">No message content used</text><rect x="450" y="125" width="300" height="125" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="468" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">Network evidence</text><text x="468" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Co-participation projection</text><text x="468" y="203" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Shortest-path accessibility</text><text x="468" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Sensitivity to actor removal</text><rect x="845" y="125" width="300" height="125" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/><text x="863" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#92400e">L&amp;D questions</text><text x="863" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Where is access concentrated?</text><text x="863" y="203" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Where is redundancy thin?</text><text x="863" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Where should we investigate?</text><line x1="355" y1="188" x2="438" y2="188" stroke="#64748b" stroke-width="2"/><polygon points="438,182 450,188 438,194" fill="#64748b"/><line x1="750" y1="188" x2="833" y2="188" stroke="#64748b" stroke-width="2"/><polygon points="833,182 845,188 833,194" fill="#64748b"/><rect x="55" y="315" width="1090" height="240" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="85" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172033">Structural result</text><text x="85" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#dc2626">Targeted loss</text><text x="235" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#172033">0.9735 → 0.8608 retained efficiency</text><text x="85" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2563eb">Random mean</text><text x="235" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#172033">0.9973 → 0.9912</text><text x="85" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#f59e0b">Gap</text><text x="235" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#172033">0.0238 → 0.1304</text><text x="85" y="505" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#334155">Interpretation boundary</text><text x="265" y="505" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#475569">Communication topology can reveal structural exposure, not the content or uniqueness of employee knowledge.</text><text x="55" y="625" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">Use the network to prioritize questions and resilience investigation, not to label people as irreplaceable.</text></svg>